name: subly
description: A premium local-first subscription and personal finance tracker.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  firebase_core: ^4.2.1
  firebase_remote_config: ^6.1.2
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  flutter_local_notifications: ^22.0.1
  go_router: ^17.0.1
  intl: ^0.20.2
  shared_preferences: ^2.5.4
  permission_handler: ^12.0.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
  phone_numbers_parser: ^9.0.25
  country_picker: ^2.0.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/subly-logo-v1.png
    - assets/banners/cabinet-eco-finance-v1.png
    - assets/banners/form-eco-zero-v1.png
    - assets/banners/offers-eco-shield-v1.png
